<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //spread operator = used to expand data
        let a=[1,2,3,4,5,6];
        let b=[...a];

        console.log(b);


        //marge arrays 
        let x=[1,2];
        let y=[3,4];
        let z=[...x,...y];
        console.log(z);

        //add items to object 
        let user={name:"ravi",age:11};
        let newuser={...user,country:"sri lanka"};




        //rest operator = oposite of spread operator 
        function sum(...numbers){
            return numbers.reduce((a,b)=>a+b);
        }

        console.log(sum(1,2,3,4));
    </script>
</body>
</html>
