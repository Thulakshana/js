<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        fetch("http://jsonplaceholder.typecode.com/users")
        .then(res=>res.json())
        .then(data=>console.log(data))
        .catch(err=>console.log(err));


        //////////////////////////////////////////////////////////////////////////
        //modern way 
        async function loadusers(){
            try{
                let res=await
                fetch("http://jsonplaceholder.typecode.com/users");
                let data=await res.json();
                console.log(data);
            }catch(err){
                console.log(err);
            }
        }
        loadusers();


    </script>
</body>
</html>
