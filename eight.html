<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="list"></ul>

<script>
let names=["kasun","ravi","supun"];

let list=document.getElementById("list");

names.forEach(name=>{
    let li=document.createElement("li");
    li.textContent=name;
    list.appendChild(li);
});

</script>

</body>
</html>
